
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090e">
<title>مشاهدة | NOXAR</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="watch.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">NOX<span>AR</span></a>
  <a href="index.html" class="back-home">العودة للرئيسية ←</a>
</header>

<main class="watch-page">
  <div class="watch-player">
    <video id="videoPlayer" controls playsinline preload="metadata">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>
    <div id="playerMessage" class="player-message">
      جاري تحميل المحتوى...
    </div>
  </div>

  <section class="watch-info">
    <span class="watch-label" id="watchCategory">NOXAR ORIGINALS</span>
    <h1 id="watchTitle">عنوان المحتوى</h1>
    <div class="watch-meta" id="watchMeta"></div>
    <p id="watchDescription"></p>
    <div class="watch-actions">
      <button id="shareButton">مشاركة المحتوى ↗</button>
      <button id="favoriteButton">☆ إضافة للمفضلة</button>
    </div>
  </section>

  <section class="suggestions">
    <h2>قد يعجبك أيضاً</h2>
    <div id="suggestionsGrid" class="suggestions-grid"></div>
  </section>
</main>

<footer>
  <a href="index.html" class="logo">NOX<span>AR</span></a>
  <p>BEYOND THE KNOWN.</p>
</footer>

<script type="module" src="watch.js"></script>
</body>
</html>
